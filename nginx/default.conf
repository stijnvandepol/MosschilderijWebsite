# Moskunst — statische one-pager
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressie voor tekstbestanden (webp en woff2 zijn al gecomprimeerd)
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json text/plain;
    gzip_min_length 1024;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Foto's en fonts veranderen nooit van inhoud onder dezelfde naam: lang cachen
    location ~* \.(webp|woff2|svg)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # CSS/JS: kort cachen zodat aanpassingen snel doorkomen
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Nette 404 terug naar de homepage (one-pager)
    error_page 404 /index.html;
}
